[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "geobench"
version = "1.1.0"
description = "A benchmark designed to advance foundation models for Earth monitoring, tailored for remote sensing. It encompasses six classification and six segmentation tasks, curated for precision and model evaluation. The package also features a comprehensive evaluation methodology and showcases results from 20 established baseline models."
readme = "README.md"
keywords = [
  "benchmark",
  "earth observation",
  "foundation models",
  "geospatial",
  "machine learning",
  "remote sensing",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [
  { name = "Alexandre Lacoste", email = "alexandre.lacoste@servicenow.com" },
  { name = "Nils Lehmann" },
  { name = "Pau Rodriguez" },
  { name = "Evan David Sherwin" },
  { name = "Hannah Kerner" },
  { name = "Björn Lütjens" },
  { name = "Jeremy Andrew Irvin" },
  { name = "David Dao" },
  { name = "Hamed Alemohammad" },
  { name = "Alexandre Drouin" },
  { name = "Mehmet Gunturkun" },
  { name = "Gabriel Huang" },
  { name = "David Vazquez" },
  { name = "Dava Newman" },
  { name = "Yoshua Bengio" },
  { name = "Stefano Ermon" },
  { name = "Xiao Xiang Zhu" },
]
requires-python = ">=3.12"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "h5py>=3.10",
  "huggingface-hub>=0.19.3",
  "numpy>=1.26",
  "rasterio>=1.3.9",
  "scipy>=1.11.2",
  "tqdm>=4.65",
]
optional-dependencies.plot = [
  "matplotlib>=3.8",
  "pandas>=2",
  "seaborn>=0.13",
]
optional-dependencies.torch = [
  "pytorch-lightning>=2.1",
  "torch>=2.1",
]
urls.Dataset = "https://huggingface.co/datasets/recursix/geo-bench-1.0"
urls.Paper = "https://arxiv.org/abs/2306.03831"
urls.Repository = "https://github.com/ServiceNow/geo-bench"
scripts.geobench-download = "geobench.geobench_download:download_benchmark"
scripts.geobench-test = "geobench.tests.launch_pytest:start"

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  { include-group = "test" },
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.uv.build-backend]
module-name = "geobench"
module-root = ""

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
exclude = "(docs|data)/"

[tool.pytest]
ini_options.addopts = "-v"
ini_options.markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "converter: marks tests as converter (deselect with '-m \"not converter\"')",
  "serial",
  "optional: run only with \"--optional\" flag",
]
