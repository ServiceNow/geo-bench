name: style
on:
  push:
    branches:
    - main
    - chore/modernize-packaging
  pull_request:
    branches:
    - main
    - chore/modernize-packaging

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group dev
    - name: Run ruff check
      run: ruff check geobench/ conftest.py
    - name: Run ruff format check
      run: ruff format --check geobench/ conftest.py
