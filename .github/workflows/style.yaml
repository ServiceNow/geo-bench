name: style
on:
  push:
    branches:
    - main
    - chore/modernize-packaging
  pull_request:
    branches:
    - main
    - chore/modernize-packaging

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run ruff check
      run: uv run ruff check geobench/ conftest.py
    - name: Run ruff format check
      run: uv run ruff format --check geobench/ conftest.py
